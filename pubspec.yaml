name: drayve
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  image_picker: ^1.2.4
  firebase_storage: ^13.6.1
  url_launcher: ^6.3.3
  dio: ^5.11.1
  cached_network_image: ^3.4.1
  custom_refresh_indicator: ^4.0.2
  provider: ^6.1.5+1
  timeago: ^3.7.1
  fl_chart: ^1.3.1
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  photo_view: ^0.15.0
  flutter_glass_morphism: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/gelo/
    - assets/images/cars/ # <--- WAJIB TAMBAHKAN BARIS INI
    - assets/images/flags/
    - assets/icons/

  fonts:
    - family: Ethnocentric
      fonts:
        - asset: assets/fonts/Ethnocentric-Italic.otf
        - asset: assets/fonts/Ethnocentric-Italic.otf
          style: italic
